name: Clear Volumes

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "clear-volumes" to delete MongoDB data on the production VM'
        required: true
        type: string

env:
  TF_VERSION: "1.9.8"
  GCP_REGION: us-central1

jobs:
  clear-volumes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Confirm destructive action
        if: inputs.confirm != 'clear-volumes'
        run: |
          echo 'Confirmation failed. Re-run the workflow and type exactly: clear-volumes'
          exit 1

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=qbiq-dig-store/terraform"

      - name: Read Terraform outputs
        id: tf
        working-directory: terraform
        run: |
          echo "instance_name=$(terraform output -raw instance_name)" >> "$GITHUB_OUTPUT"
          echo "zone=$(terraform output -raw zone)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

      - name: Copy clear-volumes script to VM
        run: |
          gcloud compute scp deploy/clear-volumes.sh "${{ steps.tf.outputs.instance_name }}:/tmp/clear-volumes.sh" --zone="${{ steps.tf.outputs.zone }}"
          gcloud compute ssh "${{ steps.tf.outputs.instance_name }}" --zone="${{ steps.tf.outputs.zone }}" --command="sudo mv /tmp/clear-volumes.sh /opt/qbiq-dig-store/clear-volumes.sh && sudo chmod +x /opt/qbiq-dig-store/clear-volumes.sh"

      - name: Clear Docker volumes on VM
        env:
          INSTANCE: ${{ steps.tf.outputs.instance_name }}
          ZONE: ${{ steps.tf.outputs.zone }}
        run: |
          gcloud compute ssh "${INSTANCE}" --zone="${ZONE}" --command="sudo /opt/qbiq-dig-store/clear-volumes.sh"

      - name: Verify public health endpoint
        env:
          PUBLIC_IP: ${{ steps.tf.outputs.public_ip }}
        run: |
          sleep 10
          curl -fsS "http://${PUBLIC_IP}/health"
