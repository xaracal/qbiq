name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TF_VERSION: "1.9.8"
  GCP_REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=qbiq/terraform"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_zone: ${{ env.GCP_REGION }}-a
        run: terraform apply -auto-approve -input=false

      - name: Read Terraform outputs
        id: tf
        working-directory: terraform
        run: |
          echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "instance_name=$(terraform output -raw instance_name)" >> "$GITHUB_OUTPUT"
          echo "zone=$(terraform output -raw zone)" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        env:
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qbiq
        run: |
          docker build -t "${REGISTRY}/backend:${{ github.sha }}" ./backend
          docker push "${REGISTRY}/backend:${{ github.sha }}"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qbiq
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            -t "${REGISTRY}/frontend:${{ github.sha }}" \
            ./frontend
          docker push "${REGISTRY}/frontend:${{ github.sha }}"

      - name: Copy deploy files to VM
        run: |
          gcloud compute ssh "${{ steps.tf.outputs.instance_name }}" --zone="${{ steps.tf.outputs.zone }}" --command="sudo mkdir -p /opt/qbiq/deploy"
          gcloud compute scp docker-compose.prod.yml "${{ steps.tf.outputs.instance_name }}:/tmp/docker-compose.prod.yml" --zone="${{ steps.tf.outputs.zone }}"
          gcloud compute scp deploy/nginx-gateway.conf "${{ steps.tf.outputs.instance_name }}:/tmp/nginx-gateway.conf" --zone="${{ steps.tf.outputs.zone }}"
          gcloud compute scp deploy/remote-deploy.sh "${{ steps.tf.outputs.instance_name }}:/tmp/remote-deploy.sh" --zone="${{ steps.tf.outputs.zone }}"
          gcloud compute ssh "${{ steps.tf.outputs.instance_name }}" --zone="${{ steps.tf.outputs.zone }}" --command="sudo mv /tmp/docker-compose.prod.yml /opt/qbiq/docker-compose.prod.yml && sudo mv /tmp/nginx-gateway.conf /opt/qbiq/deploy/nginx-gateway.conf && sudo mv /tmp/remote-deploy.sh /opt/qbiq/remote-deploy.sh && sudo chmod +x /opt/qbiq/remote-deploy.sh"

      - name: Write production env file
        env:
          PUBLIC_IP: ${{ steps.tf.outputs.public_ip }}
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qbiq
        run: |
          cat > .env.prod <<EOF
          REGISTRY=${REGISTRY}
          IMAGE_TAG=${{ github.sha }}
          MONGODB_URL=mongodb://mongo:27017
          MONGODB_DB_NAME=qbiq
          REDIS_URL=redis://redis:6379
          CACHE_TTL_SECONDS=300
          CART_SESSION_TTL_SECONDS=86400
          CORS_ORIGINS=["http://${PUBLIC_IP}"]
          EOF
          gcloud compute scp .env.prod "${{ steps.tf.outputs.instance_name }}:/opt/qbiq/.env.prod" --zone="${{ steps.tf.outputs.zone }}"

      - name: Deploy on VM
        env:
          INSTANCE: ${{ steps.tf.outputs.instance_name }}
          ZONE: ${{ steps.tf.outputs.zone }}
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qbiq
        run: |
          gcloud compute ssh "${INSTANCE}" --zone="${ZONE}" --command="sudo REGISTRY=${REGISTRY} /opt/qbiq/remote-deploy.sh"

      - name: Verify public health endpoint
        env:
          PUBLIC_IP: ${{ steps.tf.outputs.public_ip }}
        run: |
          sleep 10
          curl -fsS "http://${PUBLIC_IP}/health"
